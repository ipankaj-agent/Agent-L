<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent-L Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
      .layout {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }
      .sidebar {
        background: #111827;
        padding: 24px;
        border-right: 1px solid #1f2937;
      }
      .content {
        padding: 24px;
      }
      .card {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .metric {
        background: #1f2937;
        border-radius: 10px;
        padding: 12px;
      }
      .metric strong {
        display: block;
        font-size: 1.25rem;
        margin-top: 4px;
      }
      select, input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #374151;
        background: #1f2937;
        color: #f9fafb;
        margin-bottom: 12px;
      }
      .tag {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.8rem;
        background: #2563eb;
        color: white;
      }
      .job-item h3 {
        margin: 0 0 8px;
      }
      .job-item p {
        margin: 4px 0;
      }
      ul {
        padding-left: 20px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h2>Agent-L</h2>
        <label for="statusFilter">Status</label>
        <select id="statusFilter"></select>
        <label for="searchFilter">Search</label>
        <input id="searchFilter" type="text" placeholder="Search title or question" />
        <label>Session</label>
        <select id="sessionFilter"></select>
      </aside>
      <main class="content">
        <h1>Application Dashboard</h1>
        <p>Track LinkedIn applications, status counts, and captured questions.</p>
        <div id="metrics" class="metrics"></div>
        <div id="summary" class="card"></div>
        <div id="jobList"></div>
      </main>
    </div>
    <script src="./dist/app.js"></script>
  </body>
</html>
